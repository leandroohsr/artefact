<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Music Loader</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center start;
    background: transparent;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* ===== Music Loader ===== */
  .music-loader {
    --ink: #1a1a1a;       /* pauta e notas */
    --muted: #8a8a8a;     /* texto */
    display: flex; flex-direction: row; align-items: center; gap: 8px;
    color: var(--ink);
  }
  .music-loader svg { display: block; width: 110px; height: auto; overflow: visible; fill: currentColor; }

  .music-loader .label {
    font-size: 13px; letter-spacing: .06em; color: var(--muted);
  }
  .music-loader .label i { font-style: normal; animation: ml-dot 1.4s infinite; opacity: 0; }
  .music-loader .label i:nth-child(2) { animation-delay: .2s; }
  .music-loader .label i:nth-child(3) { animation-delay: .4s; }
  @keyframes ml-dot { 0%, 20% { opacity: 0; } 40%, 70% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>

<div class="music-loader" role="status" aria-label="Digitando">
  <svg viewBox="0 0 240 72"></svg>
  <div class="label"></div>
</div>

<script>
(function () {
  /* ---------- Config ---------- */
  const SPEED = 38;          // px/s da rolagem das notas
  const WAVE_AMP = 6;        // altura da onda (px)
  const WAVE_LEN = 110;      // comprimento da onda (px)
  const WAVE_SPEED = 2.2;    // velocidade da onda

  /* ---------- Glifos (Noto Music, SIL OFL) ---------- */
  const G = {
    clef:  "M314 801Q300 854 291.0 906.0Q282 958 282 1012Q282 1059 288.5 1100.5Q295 1142 307 1177Q320 1217 341.0 1252.5Q362 1288 385.5 1311.0Q409 1334 427 1334Q451 1334 493 1249Q514 1206 524.0 1156.0Q534 1106 534 1049Q534 978 515.0 907.5Q496 837 459.5 775.0Q423 713 372 666L407 498Q422 500 432.0 501.0Q442 502 447 502Q508 502 556.0 467.5Q604 433 632.5 377.0Q661 321 661 254Q661 177 621.5 115.5Q582 54 503 25Q508 8 532 -117Q538 -147 541.0 -164.5Q544 -182 545.0 -195.0Q546 -208 546 -225Q546 -275 521.5 -314.5Q497 -354 455.5 -376.0Q414 -398 363 -398Q311 -398 271.0 -378.5Q231 -359 208.0 -324.5Q185 -290 185 -245Q185 -197 211.5 -165.0Q238 -133 287 -133Q329 -133 355.5 -163.5Q382 -194 382 -236Q382 -272 357.0 -299.0Q332 -326 292 -326H282Q308 -365 364 -365Q433 -365 472.0 -320.0Q511 -275 511 -205Q511 -188 507.0 -159.5Q503 -131 493 -91Q483 -51 477.5 -25.0Q472 1 470 12Q436 2 390 2Q304 2 222 52Q142 102 96.0 184.0Q50 266 50 361Q50 451 91 530Q132 609 192.5 675.0Q253 741 314 801ZM341 826Q364 838 390.0 870.5Q416 903 440.0 945.0Q464 987 479.0 1029.5Q494 1072 494 1106Q494 1142 483.0 1163.0Q472 1184 445 1184Q421 1184 398.5 1162.0Q376 1140 358.5 1103.5Q341 1067 331.0 1022.0Q321 977 321 930Q321 898 327.5 872.0Q334 846 341 826ZM398 379Q371 373 347.0 353.5Q323 334 308.5 306.5Q294 279 294 248Q294 223 307.0 196.5Q320 170 339 154Q352 142 365 136Q380 129 380 123Q380 120 370 117Q332 126 301.5 151.0Q271 176 253.5 211.5Q236 247 236 287Q236 330 253.5 370.0Q271 410 302.5 442.0Q334 474 374 490L345 641Q229 547 174.5 456.5Q120 366 120 277Q120 212 154.0 156.0Q188 100 247.0 65.5Q306 31 380 31Q400 31 420.5 35.0Q441 39 464 45ZM495 55Q593 97 593 227Q593 270 571.0 305.5Q549 341 512.0 362.0Q475 383 429 383Z",
    head:  "M159 -1Q111 -1 80.5 21.5Q50 44 50 90Q50 141 78.5 181.5Q107 222 153.0 245.5Q199 269 251 269Q295 269 321.0 245.5Q347 222 347 179Q347 130 321.0 89.0Q295 48 252.5 23.5Q210 -1 159 -1Z",
    flag1: "M0 1009H26Q33 968 41.5 936.5Q50 905 66.5 875.5Q83 846 112 812L152 765Q178 736 202 704Q274 611 274 511Q274 407 186 259H170Q199 318 221.0 377.5Q243 437 243 491Q243 518 235.0 546.5Q227 575 212 605Q181 666 125.0 704.5Q69 743 0 743Z",
    rest:  "M147 878 307 683Q257 624 230.0 581.0Q203 538 203 494Q203 457 227.0 416.5Q251 376 303 314L287 292Q243 320 205 320Q177 320 163.0 301.5Q149 283 149 257Q149 225 162.5 196.5Q176 168 199 142L186 123Q117 173 84.0 214.0Q51 255 51 303Q51 346 78.0 366.0Q105 386 143 386Q173 386 221 363V365L67 570Q168 659 168 736Q168 797 104 878Z",
  };

  /* ---------- Geometria ---------- */
  const W = 240, S = 6, CY = 38, K = S / 250;   // S = espaço entre linhas
  const START = 40;
  const posY = p => CY - (p - 4) * S / 2;      // p: 0 = 1ª linha de baixo ... 8 = 5ª linha
  const STEM_W = 30, STEM_L = 875;
  const HEAD = `<use href="#ml-head" transform="translate(-198.5 -134)"/>`;

  function note(p, flag) {
    const up = p < 4, sx = up ? 118.5 : -148.5, sy = up ? 20 : -20 - STEM_L;
    let s = HEAD + `<rect x="${sx}" y="${sy}" width="${STEM_W}" height="${STEM_L}"/>`;
    if (flag) s += up
      ? `<use href="#ml-flag1" transform="translate(${sx} ${20 + STEM_L - 1009})"/>`
      : `<use href="#ml-flag1" transform="translate(${sx} ${-20 - STEM_L + 1009}) scale(1 -1)"/>`;
    return s;
  }
  function beam(p1, p2, dx = 560) {
    const up = (p1 + p2) / 2 < 4, y2 = (p2 - p1) * 125, off = up ? 118.5 : -148.5;
    const tip = up ? Math.max(0, y2) + STEM_L : Math.min(0, y2) - STEM_L;
    const t1 = tip - y2 / 4, t2 = tip + y2 / 4, bh = up ? -120 : 120;
    const stem = (x, yh, yt) => `<rect x="${x}" y="${Math.min(yh, yt)}" width="${STEM_W}" height="${Math.abs(yt - yh)}"/>`;
    return HEAD + `<use href="#ml-head" transform="translate(${dx - 198.5} ${y2 - 134})"/>`
      + stem(off, up ? 20 : -20, t1) + stem(dx + off, y2 + (up ? 20 : -20), t2)
      + `<polygon points="${off},${t1} ${dx + off + STEM_W},${t2} ${dx + off + STEM_W},${t2 + bh} ${off},${t1 + bh}"/>`;
  }
  const glyph = inner => `<g transform="scale(${K} ${-K})">${inner}</g>`;
  const bar = x => `<rect x="${x - 0.45}" y="${CY - 2 * S}" width="0.9" height="${4 * S}"/>`;
  const BAR = `<rect x="-19" y="-500" width="38" height="1000"/>`;

  /* ---------- Melodia (3 compassos 4/4, repete) ---------- */
  const M = [
    ["b", 2, 3], ["q", 4], ["b", 6, 5], ["q", 4], ["|"],
    ["q", 3], ["r"], ["b", 4, 2], ["q", 1], ["|"],
    ["q", 7], ["b", 6, 4], ["e", 5], ["r"], ["|"],
  ];
  const WIDTH = { b: 34, q: 22, e: 24, r: 20, "|": 16 };
  const P = M.reduce((a, it) => a + WIDTH[it[0]], 0);

  /* ---------- Montagem ---------- */
  const svg = document.querySelector(".music-loader svg");
  const items = [];
  let track = "";
  for (let c = 0; c < 2; c++) {
    let x = START + c * P;
    M.forEach(([t, a, b]) => {
      const w = WIDTH[t];
      let inner, p;
      if (t === "|") { inner = BAR; p = 4; }
      else if (t === "r") { inner = `<use href="#ml-rest" transform="translate(-179 -500)"/>`; p = 4; }
      else if (t === "b") { inner = beam(a, b); p = a; }
      else { inner = note(a, t === "e"); p = a; }
      track += `<g class="n"><g transform="scale(${K} ${-K})">${inner}</g></g>`;
      items.push({ x: x + (t === "|" ? w / 2 : 6), p });
      x += w;
    });
  }
  svg.innerHTML = `
    <defs>
      <path id="ml-clef"  d="${G.clef}"/>
      <path id="ml-head"  d="${G.head}"/>
      <path id="ml-flag1" d="${G.flag1}"/>
      <path id="ml-rest"  d="${G.rest}"/>
      <linearGradient id="ml-g-notes" gradientUnits="userSpaceOnUse" x1="34" x2="${W}" y1="0" y2="0">
        <stop offset="0" stop-color="#000"/><stop offset=".12" stop-color="#fff"/>
        <stop offset=".78" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
      </linearGradient>
      <linearGradient id="ml-g-staff" gradientUnits="userSpaceOnUse" x1="0" x2="${W}" y1="0" y2="0">
        <stop offset=".82" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
      </linearGradient>
      <mask id="ml-m-notes" maskUnits="userSpaceOnUse" x="0" y="-20" width="${W}" height="100">
        <rect x="0" y="-20" width="${W}" height="100" fill="url(#ml-g-notes)"/>
      </mask>
      <mask id="ml-m-staff" maskUnits="userSpaceOnUse" x="0" y="-20" width="${W}" height="100">
        <rect x="0" y="-20" width="${W}" height="100" fill="url(#ml-g-staff)"/>
      </mask>
    </defs>
    <g mask="url(#ml-m-staff)" fill="none" stroke="currentColor" stroke-width="0.8" class="staff">
      <path/><path/><path/><path/><path/>
    </g>
    ${bar(4)}
    <g transform="translate(17 ${posY(2)})">${glyph(`<use href="#ml-clef" transform="translate(-355 -250)"/>`)}</g>
    <g mask="url(#ml-m-notes)">${track}</g>
  `;

  const lines = [...svg.querySelectorAll(".staff path")];
  const els = [...svg.querySelectorAll(".n")];

  /* ---------- Onda ----------
     A onda nasce na clave (parada) e cresce para a direita, como uma bandeira */
  const X_CALM = 34;
  function env(x) {
    const t = Math.min(1, Math.max(0, (x - X_CALM) / 90));
    return t * t * (3 - 2 * t);
  }
  const waveY = (x, t) => CY + WAVE_AMP * env(x) * Math.sin((x - X_CALM) / WAVE_LEN * 2 * Math.PI - t * WAVE_SPEED);
  const slope = (x, t) => Math.atan2(waveY(x + 0.5, t) - waveY(x - 0.5, t), 1);
  // ponto da pauta deslocado na direção perpendicular à onda (p = meia-linha)
  function pt(x, p, t) {
    const a = slope(x, t), d = (p - 4) * S / 2;
    return { x: x + d * Math.sin(a), y: waveY(x, t) - d * Math.cos(a), a: a * 180 / Math.PI };
  }

  /* ---------- Animação ---------- */
  function frame(ms) {
    const t = ms / 1000;
    const off = (t * SPEED) % P;

    lines.forEach((path, i) => {
      let d = "";
      for (let x = 4; x <= W; x += 3) {
        const q = pt(x, i * 2, t);
        d += (x === 4 ? "M" : "L") + q.x.toFixed(2) + " " + q.y.toFixed(2);
      }
      path.setAttribute("d", d);
    });

    els.forEach((el, i) => {
      const it = items[i], q = pt(it.x - off, it.p, t);
      el.setAttribute("transform", `translate(${q.x.toFixed(2)} ${q.y.toFixed(2)}) rotate(${q.a.toFixed(2)})`);
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
